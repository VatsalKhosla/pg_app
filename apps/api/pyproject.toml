[project]
name = "pg-platform-api"
version = "0.1.0"
description = "API and background worker for the PG booking platform."
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.143.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "sentry-sdk==2.71.0",
    "sqlalchemy[asyncio]==2.1.4",
    "structlog==26.1.0",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.169.0",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1"
# Supply-chain cooldown: resolve only distributions uploaded at least a week ago (ADR 0007).
exclude-newer = "1 week"

[tool.uv.build-backend]
module-name = "app"

# ---------------------------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",     # shadowed builtins
    "ASYNC", # blocking calls in async code
    "B",     # bugbear
    "BLE",   # blind except
    "C4",    # comprehensions
    "DTZ",   # naive datetimes
    "E",     # pycodestyle errors
    "ERA",   # commented-out code
    "F",     # pyflakes
    "FAST",  # FastAPI best practices
    "FURB",  # refurb
    "G",     # logging format strings
    "I",     # import sorting
    "LOG",   # logging misuse
    "N",     # naming
    "PERF",  # performance anti-patterns
    "PIE",   # misc lints
    "PL",    # pylint
    "PT",    # pytest style
    "PTH",   # pathlib over os.path
    "RET",   # return statements
    "RSE",   # raise statements
    "RUF",   # ruff-specific
    "S",     # bandit security rules
    "SIM",   # simplifications
    "SLF",   # private member access
    "T10",   # debugger leftovers
    "T20",   # print statements (use structlog)
    "TC",    # imports only needed for typing
    "TID",   # tidy imports and banned APIs
    "UP",    # modern syntax
    "W",     # pycodestyle warnings
]
ignore = [
    "PLR0913", # FastAPI handlers and services take many injected dependencies by design
    "PLR2004", # magic values: money maths uses literal basis points (10_000) on purpose
]

[tool.ruff.lint.per-file-ignores]
# Migrations are standalone scripts Alembic generates; keep their imports plain.
"migrations/**/*.py" = ["TC001", "TC002", "TC003"]
# The injectable clock is the one place allowed to read the system time.
"src/app/core/clock.py" = ["TID251"]
# FastAPI evaluates route signatures at runtime, so their imports must stay real imports.
"src/app/modules/*/router.py" = ["TC001", "TC002", "TC003"]
"tests/**/*.py" = [
    "S101",    # assert is how pytest works
    "S105",    # throwaway credentials for test containers
    "S106",
    "TC001",   # tests define FastAPI routes inline, which read annotations at runtime
    "TC002",
    "TC003",
    "S603",    # tests start the app's own entrypoints as subprocesses
    "SLF001",  # tests may inspect internals
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and SQLAlchemy read annotations at runtime, so their imports must stay real imports.
runtime-evaluated-base-classes = [
    "app.core.db.AppendOnlyModel",
    "app.core.db.Base",
    "app.core.db.Model",
    "app.core.schemas.ApiModel",
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# "Now" comes only from the injectable clock (CLAUDE.md, engineering rules); app.core.clock is
# the single place allowed to read the system time.
"datetime.datetime.now".msg = "Read the time from the injectable clock (app.core.clock)."
"datetime.datetime.utcnow".msg = "Read the time from the injectable clock (app.core.clock)."
"datetime.datetime.today".msg = "Read the time from the injectable clock (app.core.clock)."
"datetime.date.today".msg = "Read the date from the injectable clock (app.core.clock)."
"time.time".msg = "Read the time from the injectable clock (app.core.clock)."
"time.time_ns".msg = "Read the time from the injectable clock (app.core.clock)."

# ---------------------------------------------------------------------------------------------
# mypy: strict everywhere, and no explicit Any in the pure domain core
# ---------------------------------------------------------------------------------------------
[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "app.core.calendar",
    "app.core.ids",
    "app.core.money",
    "app.modules.*.domain",
    "app.modules.*.domain.*",
]
disallow_any_explicit = true

# ---------------------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------------------
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
markers = ["integration: needs Docker; runs PostgreSQL and Valkey in throwaway containers"]
addopts = ["-ra", "--import-mode=importlib"]
# strict_config, strict_markers, strict_xfail and strict_parametrization_ids.
strict = true
filterwarnings = ["error"]

# ---------------------------------------------------------------------------------------------
# import-linter: the module and layer rules (CLAUDE.md, ARCHITECTURE §5), run by `make lint`
# ---------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modules are layered: router > service > schemas | policies | repository > models > domain"
type = "layers"
containers = ["app.modules.*"]
layers = ["(router)", "(service)", "(schemas) | (policies) | (repository)", "(models)", "(domain)"]

[[tool.importlinter.contracts]]
name = "Domain code is pure: no web framework, database, cache, HTTP client, settings or logging"
type = "forbidden"
source_modules = ["app.core.calendar", "app.core.ids", "app.core.money", "app.modules.*.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "asyncpg",
    "redis",
    "httpx",
    "pydantic_settings",
    "structlog",
    "app.config",
    "app.core.db",
    "app.core.redis",
    "app.core.logging",
]

[[tool.importlinter.contracts]]
name = "Config and core never depend on business modules or the entrypoints"
type = "forbidden"
source_modules = ["app.config", "app.core"]
forbidden_modules = ["app.modules", "app.jobs", "app.main", "app.models", "app.openapi", "app.worker"]
