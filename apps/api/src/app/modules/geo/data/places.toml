# The geo reference data's manifest (ADR 0020): which places there are, and which OpenStreetMap
# element each one is. Written by hand; `make geo-refresh` reads it and writes places.json, the
# coordinates, boundaries and metro lines included. Never type a coordinate in here or there.
#
# To add a place, find its element on https://www.openstreetmap.org (search, then "Query
# features" or the element's page), add an entry with the element's type and id, run
# `make geo-refresh` and review the diff. The refresh prints a note when our name differs from
# OpenStreetMap's.
#
# Left out until there is a source (docs/BUILD_PLAN.md, step 2.1):
# - Old Rajinder Nagar: OpenStreetMap has no place, boundary or address by that name.
# - The Gurugram and Noida hubs: the founders haven't named them yet.

# Cities: the centre is OpenStreetMap's for the city's boundary.

[[cities]]
slug = "delhi"
name = "Delhi"
osm = "relation/1942586"

[[cities]]
slug = "gurugram"
name = "Gurugram"
osm = "relation/3577685"

[[cities]]
slug = "noida"
name = "Noida"
osm = "relation/18814682"

