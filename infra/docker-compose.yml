# Local infrastructure for `make dev` (docs/adr/0008-local-infrastructure.md).
#
# Every port is bound to 127.0.0.1 only, every image is pinned by tag and digest, and every service
# has a health check, so `docker compose up --wait` returns only when all of them are usable.
# Credentials here are for local development only; real ones never live in this repository.
# (PostgreSQL reserves role names starting with pg_, hence the plain "platform" role.)
name: pg-platform

services:
  postgres:
    build: ./postgres
    image: pg-platform/postgres:18-postgis-3.6
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=platform", "--dbname=platform"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valkey:
    # Redis-compatible cache and rate-limit store; the engine ElastiCache offers as Valkey.
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    command: ["valkey-server", "--requirepass", "platform", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a platform --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible object storage (SeaweedFS all-in-one); requests must be signed with the
    # identity in seaweedfs/s3.json, as on AWS.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json", "-admin.ui=false"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  mailpit:
    # Catches every email the app sends; inbox at http://127.0.0.1:8025.
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  s3-data:
