packages:
  - apps/web
  - packages/*

# Supply-chain guards (docs/adr/0007-toolchain-and-dependency-policy.md).
# Install only versions published at least 7 days ago (value in minutes).
minimumReleaseAge: 10080
# Fail when a package's publishing trust level drops between versions (for example a release
# without provenance after releases with it), a common sign of a hijacked maintainer account.
trustPolicy: no-downgrade
# Reviewed exceptions only, each pinned to one exact version with the reason.
trustPolicyExclude:
  # 2023 backport of the CVE-2022-25883 fix to semver 6.x, published by npm CLI maintainer
  # lukekarrys by hand (no provenance) after the automated 7.5.x releases had it. Reviewed
  # 2026-10-18. Used by eslint-plugin-import via eslint-config-next.
  - semver@6.3.1
# Dependencies may run install scripts only when allowed here after review.
strictDepBuilds: true
allowBuilds:
  # Its postinstall (napi-postinstall) only downloads the native binding when the package
  # manager skipped it; pnpm installs @unrs/resolver-binding-<platform> itself. Reviewed 2026-10-18.
  unrs-resolver: false
  # Reviewed 2026-10-19, both via next-intl's message tooling: the scripts only fetch or compile
  # a native binary when its prebuilt platform package is missing; pnpm installs that package.
  "@parcel/watcher": false
  "@swc/core": false
# Lighthouse (dev only) accepts puppeteer-core ^25.9. From 25.13, puppeteer-core depends on
# chromium-bidi 157.x, published since 2026-09-30 without the provenance its earlier releases had,
# which trustPolicy refuses. 25.12.0 uses chromium-bidi 17.0.2, which has provenance. Reviewed
# 2026-10-19; drop the override once chromium-bidi releases carry provenance again.
overrides:
  puppeteer-core: 25.12.0
# openapi-typescript 7.13 declares typescript ^5 but only uses the compiler API to print the
# generated file, which TypeScript 6 does identically (make check-client compares the output).
# Reviewed 2026-10-19; drop this once openapi-typescript allows TypeScript 6.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"
# Advisories reviewed and accepted because our code can't reach the flaw, and no fix exists or the
# fix is still inside the cooldown (`make audit` fails on anything else). Review again whenever a
# fix ships.
auditConfig:
  ignoreGhsas:
    # fast-uri < 3.1.9: scheme spoofing, host confusion and path normalisation in URI parsing.
    # Reached only through ajv, from @hookform/resolvers (we import only its zod resolver, so ajv
    # never runs) and from Lighthouse (dev only). 3.1.9 clears the cooldown on 2026-10-27: update
    # it then and drop these four. Reviewed 2026-10-24.
    - GHSA-w74x-v6f9-j3xg
    - GHSA-xhq7-xmqj-769h
    - GHSA-wjr9-j795-jxcr
    - GHSA-333x-w4r6-6crp
    # zod < 4.6.6: memory exhaustion validating oversized constrained collections. Our zod is 4.6.7;
    # the old 3.x copy is Lighthouse's (dev only, via puppeteer-core > chromium-bidi), checking
    # messages from the local browser, and no 3.x fix exists. Reviewed 2026-10-24.
    - GHSA-mrhx-c7xc-m3w5
    # braces <= 3.0.3: stack exhaustion from deeply nested glob patterns. Reached only through
    # ESLint's tooling (eslint-config-next > fast-glob > micromatch), with our own config's
    # patterns. Reviewed 2026-10-19.
    - GHSA-vfj7-8cjw-p6xm
# Exact versions in package.json; the lockfile pins everything else.
savePrefix: ""
