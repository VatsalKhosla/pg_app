# Every check that guards main (docs/ci.md). Each job runs the same make targets as a developer's
# machine, so a green pull request means `make check` (and more) passes on a clean runner.
#
# Actions are pinned by commit SHA (the tag is in the comment), the token is read-only, and
# checkouts don't keep credentials around.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # The uv version developers use (ADR 0007).
  UV_VERSION: "0.13.1"

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Property tests run 10,000 cases per property here, 200 locally (ADR 0010).
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --directory apps/api --locked
      - name: Lint (ruff, import-linter)
        run: make lint-api
      - name: Type-check (mypy --strict)
        run: make typecheck-api
      - name: Test, unit and integration (PostGIS and Valkey in containers)
        run: |
          set -o pipefail
          make test-api 2>&1 | tee "$RUNNER_TEMP/test-api.log"
      # Pricing (and, as they come, booking, payments and the ledger) keep at least 95% branch
      # coverage of their pure domain code (CLAUDE.md, ADR 0037).
      - name: Branch coverage of the money code
        run: make coverage-money
      # Each failed test as an annotation, which the checks API shows without the job's log; the
      # log's end when no test is named (a crash, a collection error).
      - name: Annotate failed tests
        if: failure()
        run: |
          plain="$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/test-api.log")"
          failed="$(printf '%s\n' "$plain" | grep -E '^(FAILED|ERROR) ' || true)"
          if [ -n "$failed" ]; then
            printf '%s\n' "$failed" | sed 's/^/::error title=API test::/'
          else
            printf '::error title=API tests ended::%s\n' "$(printf '%s\n' "$plain" | tail -n 30 | tr '\n' ' ')"
          fi

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 12 is a native binary and fetches the Node.js version package.json pins.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Lint (eslint, prettier)
        run: make lint-web
      - name: Type-check (tsc --strict)
        run: make typecheck-web
      - name: Test (Vitest)
        run: make test-web
      - name: Build
        run: make web-build

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The browser tests sign in against the real API and its worker (scripts/e2e-api.sh), on
      # PostgreSQL, Valkey and SeaweedFS from infra/docker-compose.yml.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --directory apps/api --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system libraries
        run: pnpm --filter @pg-platform/web exec playwright install --with-deps chromium
      - name: Test in a browser (Playwright, against a production build and the real API)
        run: make e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/.e2e-api.log
            apps/web/.e2e-worker.log
          # The API's and worker's logs are dotfiles, which the action leaves out unless told
          # otherwise.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  client:
    name: API client
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: uv sync --directory apps/api --locked
      - run: pnpm install --frozen-lockfile
      - name: Fail if packages/api-client is out of date with the API
        run: make check-client

  contract:
    name: API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail on breaking changes to the API schema (oasdiff)
        env:
          # The pull request's target branch, or the commit main was at before this push.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          OASDIFF_FORMAT: githubactions
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "Nothing to compare against (a new branch or a manual run)."
            exit 0
          fi
          make api-breaking BASE="$BASE"

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflows (actionlint, zizmor with its online audits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-workflows

  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --directory apps/api --locked
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: File hygiene (whitespace, line endings, YAML/TOML, merge markers, large files)
        env:
          # Their checks run as the jobs above and in the Security workflow.
          SKIP: ruff-check,ruff-format,mypy,eslint,prettier,gitleaks
        run: uv run --project apps/api --locked pre-commit run --all-files --show-diff-on-failure

  # Staging (ADR 0047, docs/runbooks/staging.md): a push to main that passes every check above is
  # built into the API and web images, published to GitHub's container registry, and deployed to
  # Render through each service's deploy hook. Until the founders add the hooks, the images are
  # published and the deploy is skipped.
  staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, e2e, client, contract, workflows, hooks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      packages: write # publish the images to GitHub's container registry
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    env:
      # What the web image inlines (apps/web/src/config/env.ts).
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SITE_URL: https://staging.fixyourstay.in
      NEXT_PUBLIC_API_URL: https://api.staging.fixyourstay.in
      # Neon's object storage (render.yaml): the public media bucket, and where uploads go.
      NEXT_PUBLIC_MEDIA_URL: https://br-tiny-surf-b4c7xiwd.storage.c-6.us-east-2.aws.neon.tech/pg-platform-media
      NEXT_PUBLIC_UPLOAD_ORIGIN: https://br-tiny-surf-b4c7xiwd.storage.c-6.us-east-2.aws.neon.tech
      # Cloudflare's published test site key, which always passes; for staging only.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # OpenStreetMap's own tiles: a staging site's light use is within their tile policy.
      NEXT_PUBLIC_MAP_TILES_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      NEXT_PUBLIC_MAP_TILES_ATTRIBUTION: © OpenStreetMap contributors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the API and web images
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
          make api-image API_IMAGE="$registry/pg_app-api:$GITHUB_SHA"
          make web-image WEB_IMAGE="$registry/pg_app-web:$GITHUB_SHA"
      - name: Publish them to GitHub's container registry
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for name in pg_app-api pg_app-web; do
            docker tag "$REGISTRY/$name:$GITHUB_SHA" "$REGISTRY/$name:staging"
            docker push --quiet "$REGISTRY/$name:$GITHUB_SHA"
            docker push --quiet "$REGISTRY/$name:staging"
            digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REGISTRY/$name:$GITHUB_SHA" | grep -m 1 "^$REGISTRY/$name@")"
            echo "${name//-/_}_DIGEST=$digest" >> "$GITHUB_ENV"
          done
          docker logout ghcr.io
      - name: Deploy to Render
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [[ -z "$API_HOOK" || -z "$WEB_HOOK" ]]; then
            echo "::notice title=Staging::Images published; add RENDER_DEPLOY_HOOK_API and RENDER_DEPLOY_HOOK_WEB to deploy them (docs/runbooks/staging.md)."
            exit 0
          fi
          deploy() {
            local image
            image="$(jq --raw-output --null-input --arg image "$2" '$image | @uri')"
            curl --fail --silent --show-error --max-time 30 --request POST "$1&imgURL=$image" > /dev/null
          }
          # The API first: it brings the database up to date as it starts.
          deploy "$API_HOOK" "$pg_app_api_DIGEST"
          deploy "$WEB_HOOK" "$pg_app_web_DIGEST"
          echo "::notice title=Staging::Deploying ${GITHUB_SHA::7} to https://staging.fixyourstay.in"
